# ~/.config/theme-switcher/config.toml  (alles optional)

[targets]
dms = true        # DMS-Theme schreiben und aktivieren (färbt über Matugen auch Hyprland)
wallpaper = true  # Hintergrund per "dms ipc call wallpaper set" setzen
hyprland = false  # eigene hypr/theme-switcher.lua (nur wenn du dms.colors nicht nutzt)
ghostty = false   # ~/.config/ghostty/themes/theme-switcher schreiben
starship = true   # Palette "theme_switcher" in ~/.config/starship.toml

[icons]
# adwaita = immer Adwaita in der passendsten Farbe (braucht Adwaita-colors)
# yaru    = passende Yaru-Farbe
# theme   = Icon-Theme aus dem jeweiligen Theme (z. B. Omarchy icons.theme)
style = "adwaita"

[paths]
# themes_dir = "~/.local/share/theme-switcher/themes"
# aether_dir = "~/.config/aether"

[hooks]
# Befehle nach jedem Wechsel; {name} und {dir} werden ersetzt
post_apply = [
  # "notify-send 'Theme' '{name}'",
]
