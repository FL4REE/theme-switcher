[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theme-switcher"
version = "0.1.0"
description = "Themes für Hyprland + DankMaterialShell speichern, wechseln und aus Aether importieren"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik (FL4REE)" }]
dependencies = []

[project.scripts]
themectl = "theme_switcher.cli:main"

[tool.setuptools.packages.find]
include = ["theme_switcher*"]
